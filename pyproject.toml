[project]
name = "accio-launcher"
version = "0.5.2"
description = "Launcher pour les jeux Harry Potter sur PC"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "Pillow>=12",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
accio-launcher = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]
