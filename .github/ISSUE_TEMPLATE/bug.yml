name: Report a bug / Signaler un bug
description: The launcher crashes, shows an error or doesn't do what it should. / Le launcher plante, affiche une erreur ou ne fait pas ce qu'il devrait.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Write in English or in French. / Merci de signaler ce problème. Écrivez en anglais ou en français.

        - **A game that won't start, an install question?** The [Discord](https://discord.gg/TNwDQd7KGe) usually answers faster. / **Un jeu qui ne démarre pas, une question d'installation ?** Le Discord répond souvent plus vite.
        - **A security issue?** Don't post it here, everyone can read it: [report it privately](https://github.com/ludvdber/AccioLauncher/security/advisories/new). / **Une faille de sécurité ?** Pas ici : signalez-la en privé.

        **Please attach the launcher report: without it, we can't tell what happened.** / **Joignez le rapport du launcher : sans lui, on ne peut pas savoir ce qui s'est passé.**

  # Mêmes réponses, mot pour mot, que idee.yml et .github/etiquettes.json : elles
  # déclenchent l'étiquette du jeu (workflow « étiquettes »).
  - type: dropdown
    id: jeu
    attributes:
      label: Game / Jeu concerné
      options:
        - The launcher itself / Le launcher lui-même
        - Philosopher's Stone / À l'École des Sorciers
        - Chamber of Secrets / La Chambre des Secrets
        - Prisoner of Azkaban / Le Prisonnier d'Azkaban
        - Goblet of Fire / La Coupe de Feu
        - Order of the Phoenix / L'Ordre du Phénix
        - Half-Blood Prince / Le Prince de Sang-Mêlé
        - Deathly Hallows Part 1 / Les Reliques de la Mort, partie 1
        - Deathly Hallows Part 2 / Les Reliques de la Mort, partie 2
    validations:
      required: true

  - type: textarea
    id: probleme
    attributes:
      label: What happened? / Que s'est-il passé ?
      description: What you saw, and what you expected instead. Copy the error message if there is one. / Ce que vous avez vu, ce que vous attendiez. Recopiez le message d'erreur s'il y en a un.
      placeholder: "E.g.: the Order of the Phoenix download stops at 80% with \"Failed\", although my connection works."
    validations:
      required: true

  - type: textarea
    id: etapes
    attributes:
      label: How to reproduce it? / Comment le reproduire ?
      description: The steps, in order. If it only happens now and then, say so too. / Les étapes, dans l'ordre. Si ça n'arrive que de temps en temps, dites-le aussi.
      placeholder: |
        1. Open the launcher
        2. Click on…
        3. …

  - type: textarea
    id: diagnostic
    attributes:
      label: Launcher report / Rapport du launcher
      description: |
        In the launcher: **Settings → About → Copy report**, then paste it here (Ctrl+V). The same button also puts the full report on your Desktop, `Accio Launcher - rapport.txt`: drag that file into this field, it holds the logs too. It contains the launcher and Windows versions, your graphics card, the installed games and the latest errors. Paths are anonymised: nothing personal is in it.
        If the launcher crashed, the crash window has the same **Copy report** button.
        If the launcher won't open at all, drag its log file into this field: `%USERPROFILE%\Games\AccioLauncher\_Launcher\logs\accio_launcher.log` (Linux: `~/Games/AccioLauncher/_Launcher/logs/accio_launcher.log`).

        Dans le launcher : **Paramètres → À propos → Copier le rapport**, puis collez ici (Ctrl+V), ou glissez ici le fichier `Accio Launcher - rapport.txt` que le bouton pose sur votre Bureau. Après un plantage, la fenêtre de plantage a le même bouton. Si le launcher ne s'ouvre plus, glissez ici son journal (chemin ci-dessus).
      render: text
      placeholder: "Paste the report copied from the launcher here. / Collez ici le rapport copié depuis le launcher."
    validations:
      required: true

  - type: textarea
    id: captures
    attributes:
      label: Screenshots / Captures d'écran
      description: Optional, but a picture often says more than a description. Drag it into this field. / Facultatif, mais une image en dit souvent plus. Glissez-la dans ce champ.

  - type: checkboxes
    id: verifications
    attributes:
      label: Before sending / Avant d'envoyer
      options:
        - label: I have the latest launcher version (shown in Settings → About). / J'ai la dernière version du launcher (Paramètres → À propos).
          required: true
        - label: I searched the existing issues and this problem isn't there yet. / J'ai cherché dans les issues existantes, et ce problème n'y est pas encore.
          required: true
