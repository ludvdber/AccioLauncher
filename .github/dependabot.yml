# Dependabot : une pull request par semaine au plus et par écosystème, les
# mises à jour regroupées. Chaque PR passe par la CI comme n'importe quelle
# autre ; rien n'est fusionné tout seul.
#
# - github-actions : garde à jour les actions épinglées par empreinte dans
#   .github/workflows (empreinte ET commentaire de version).
# - pip : les planchers de pyproject.toml et des requirements. Les alertes
#   de sécurité, elles, arrivent sans attendre le lundi.
#
# `cooldown` : une version neuve attend 7 jours avant d'être proposée, le temps
# qu'une version piégée soit retirée de PyPI ou de la place de marché. Les mises
# à jour de sécurité ne sont pas retenues.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Les paquets de la CI, figés avec leurs empreintes (Scorecard,
  # « Pinned-Dependencies ») : Dependabot met à jour version et empreintes.
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      ci:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
