# Release Accio Launcher : l'exécutable est construit ICI, plus sur un poste.
#
# Un exe construit à la main dépend de la machine qui le produit (le PATH de
# Git Bash y glissait ses DLL), le tag pouvait ne pas pointer sur le commit
# réellement construit, et rien ne prouvait à l'utilisateur que le fichier
# téléchargé sortait de ce code. Construit par GitHub à partir du tag, il porte
# une attestation de provenance signée (Sigstore) : qui la vérifie sait de quel
# dépôt, de quel commit et de quel workflow il sort. C'est ce qui tient lieu de
# certificat de signature, que le projet n'a pas.
#
# Tout se fait depuis le site GitHub, sans ligne de commande (souhait de Ludo) :
# Actions → release → Run workflow.
#   - case « Créer la release » décochée : build d'essai, exe joint au run,
#     sans attestation ni release.
#   - cochée : build, attestation, release en BROUILLON nommée d'après
#     APP_VERSION. Le tag n'existe pas encore : GitHub le crée sur le commit
#     construit au moment de « Publish release ». Rien n'est public avant, et
#     l'auto-update ne voit pas un brouillon.
# Pas de déclenchement sur tag : publier le brouillon CRÉE le tag, et ce tag
# relancerait un second build qui échouerait sur une release déjà existante.
name: release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Créer la release (brouillon) — sinon simple build d'essai"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write           # créer la release en brouillon
      id-token: write           # signer l'attestation (Sigstore)
      attestations: write       # l'enregistrer auprès de GitHub
      artifact-metadata: write  # demandé par actions/attest v4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pas de cache pip ici : un exe publié se construit sur des paquets
      # téléchargés pour lui, pas sur un cache partagé avec d'autres runs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.14"

      # Le tag se DÉDUIT de config.APP_VERSION (accordé à pyproject et au README
      # par test_config) : un tag saisi à la main pourrait annoncer une autre
      # version que l'exe, et l'auto-update, qui compare les deux, le
      # reproposerait en boucle. Refusé hors de main, et si la version a déjà
      # une release ou un tag : c'est qu'on a oublié de monter le numéro.
      - name: Version à publier
        id: version
        if: inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Error "Une release se construit depuis main (lancé depuis $env:GITHUB_REF)."
            exit 1
          }
          $version = (Select-String -Path src/core/config.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Error "La release $tag existe déjà : monter APP_VERSION."; exit 1 }
          gh api "repos/$env:GH_REPO/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Error "Le tag $tag existe déjà : monter APP_VERSION."; exit 1 }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0

      # build.bat enchaîne icône, lint, tests, géométrie avec les vraies polices
      # et PyInstaller, et s'arrête au premier échec : le même chemin que sur
      # un poste. PATH réduit au système et au Python du workflow, parce que
      # PyInstaller cherche les DLL dépendantes dans le PATH et que le runner y
      # expose Git, Perl, OpenSSL… L'exe ne doit rien devoir à la machine.
      - name: Construire (build.bat)
        shell: pwsh
        env:
          ACCIO_PY: python
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
        run: |
          $py = Split-Path $env:PYTHON_EXE
          $sys = $env:SystemRoot
          $env:PATH = "$py;$py\Scripts;$sys\System32;$sys;$sys\System32\Wbem;$sys\System32\WindowsPowerShell\v1.0"
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Empreinte SHA-256
        id: empreinte
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/AccioLauncher.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "AccioLauncher.exe : SHA-256 ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - name: Joindre l'exécutable au run (essai)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AccioLauncher-essai
          path: dist/AccioLauncher.exe
          retention-days: 7

      - name: Attestation de provenance
        id: attestation
        if: inputs.release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/AccioLauncher.exe

      # Les notes partent de .github/release-notes.md, où l'empreinte et le tag
      # sont posés ici : il ne reste qu'à écrire les nouveautés.
      - name: Release en brouillon
        if: inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA256: ${{ steps.empreinte.outputs.sha256 }}
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # La preuve de provenance voyage AUSSI à côté de l'exe : vérifiable
          # hors de GitHub (`cosign verify-blob-attestation --bundle`), et c'est
          # ce que lit OpenSSF Scorecard (« Signed-Releases »). L'auto-update ne
          # retient que l'asset en `.exe`, ce fichier ne le gêne pas.
          $signature = 'dist/AccioLauncher.exe.sigstore.json'
          Copy-Item $env:BUNDLE $signature
          $notes = Get-Content .github/release-notes.md -Raw -Encoding utf8
          $notes = $notes.Replace('{SHA256}', $env:SHA256).Replace('{TAG}', $env:TAG)
          $fichier = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -Path $fichier -Value $notes -Encoding utf8NoBOM
          # --target : le tag naîtra sur le commit CONSTRUIT, à la publication.
          $version = $env:TAG.TrimStart('v')
          gh release create $env:TAG dist/AccioLauncher.exe $signature `
            --draft --target $env:GITHUB_SHA `
            --title "🪄 Accio Launcher $version" `
            --notes-file $fichier
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Le formulaire de Microsoft (SmartScreen), prérempli pour CETTE version,
      # dans le résumé du run : chaque champ, et le texte anglais à copier.
      - name: Texte de soumission à Microsoft
        if: inputs.release
        shell: pwsh
        env:
          SHA256: ${{ steps.empreinte.outputs.sha256 }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $texte = Get-Content .github/microsoft-submission.md -Raw -Encoding utf8
          $texte.Replace('{SHA256}', $env:SHA256).Replace('{TAG}', $env:TAG) >> $env:GITHUB_STEP_SUMMARY
