# OpenSSF Scorecard : note les pratiques de sécurité du dépôt (protection de
# branche, actions épinglées, permissions des workflows, politique de
# sécurité, releases signées…) et publie le détail dans l'onglet Security →
# Code scanning. Chaque point faible y vient avec sa correction.
#
# `publish_results: true` impose une forme stricte à ce fichier (runner
# ubuntu, permissions minimales, aucune variable d'environnement globale,
# actions d'une liste fermée) : le modifier au-delà des commentaires fait
# échouer la publication.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write  # déposer le rapport dans Code scanning
      id-token: write         # publier le score (badge, api.scorecard.dev)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
