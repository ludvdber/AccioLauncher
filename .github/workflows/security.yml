name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # La version du build (build.bat) et de tests.yml : c'est sous elle
          # que les dépendances sont résolues, donc elle que l'audit doit voir.
          # 3.14 et non 3.15 : PyYAML (requis par bandit) n'a pas de paquet 3.15, et
          # un paquet construit sur place échappe au contrôle des empreintes.
          python-version: "3.14"

      # Versions ET empreintes figées (.github/requirements/securite.txt) : un
      # outil d'audit installé sans vérification serait le maillon faible de
      # l'audit lui-même. Dependabot tient le fichier à jour.
      - name: Install security tools
        run: pip install --require-hashes -r .github/requirements/securite.txt

      # Les règles écartées et leur raison sont dans `.bandit`, que Bandit lit
      # tout seul. Chaque appel de processus relu porte un `# nosec` sur sa
      # ligne : un appel ajouté sans relecture fait échouer ce job. fuzz/ est
      # écarté comme tests/ : du code de vérification, fait d'`assert`, qui ne
      # part pas dans l'exécutable.
      - name: Bandit security scan
        run: bandit -r . -x ./tests,./fuzz

      # `-r` : les dépendances DU LAUNCHER. Sans argument, pip-audit examine
      # l'environnement courant — ici bandit et pip-audit eux-mêmes — et son
      # vert ne disait rien du launcher (constaté le 2026-09-18).
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # Les planchers ci-dessus se résolvent au plus récent ; ce qui s'installe
      # VRAIMENT (CI et exécutables publiés) est figé dans .github/requirements.
      # Le 2026-10-25, ces fichiers portaient setuptools 84.0.0 et filelock
      # 4.2.0, vulnérables, alors que l'audit des planchers restait vert.
      - name: Audit des paquets figés
        run: |
          pip-audit --require-hashes --disable-pip -r .github/requirements/tests.txt
          pip-audit --require-hashes --disable-pip -r .github/requirements/securite.txt
          pip-audit --require-hashes --disable-pip -r .github/requirements/fuzz.txt

      # Les workflows eux-mêmes : action non épinglée, injection dans un `run:`,
      # identifiants laissés au checkout, Dependabot sans délai. Le jeton (lecture
      # seule) sert à reconnaître une action dont la version connue est vulnérable.
      - name: Audit des workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github
