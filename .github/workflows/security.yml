name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # La version du build (build.bat) et de tests.yml : c'est sous elle
          # que les dépendances sont résolues, donc elle que l'audit doit voir.
          # En 3.15 depuis le 2026-10-31 : bandit, qui exigeait PyYAML (sans
          # paquet 3.15), est remplacé par les règles S de ruff. Tout
          # securite.txt s'installe en roues, aucun paquet construit sur place.
          python-version: "3.15"

      # Versions ET empreintes figées (.github/requirements/securite.txt) : un
      # outil d'audit installé sans vérification serait le maillon faible de
      # l'audit lui-même. Dependabot tient le fichier à jour.
      - name: Install security tools
        run: pip install --require-hashes -r .github/requirements/securite.txt

      # Les règles de sécurité de ruff (flake8-bandit), lancées À PART : le jeu
      # de règles de pyproject.toml est figé, `--select S` le remplace pour ce
      # seul appel. Une règle écartée, et une seule : S311 (« random n'est pas
      # cryptographique ») ; il ne sert qu'aux particules, aux étoiles du
      # carrousel et à l'image de partage du build, et tests/test_securite.py
      # échoue si un AUTRE module l'importe. Le « importer subprocess » de
      # bandit (B404) n'existe pas dans ruff. Chaque appel de processus relu
      # porte un `# noqa: S603` (ruff ne lit pas les `# nosec` de bandit) : un
      # appel ajouté sans relecture fait échouer ce job. fuzz/ est écarté comme
      # tests/ : du code de vérification, fait d'`assert`, qui ne part pas dans
      # l'exécutable.
      - name: Règles de sécurité (ruff S)
        run: ruff check --select S --ignore S311 --extend-exclude tests,fuzz --output-format github .

      # `-r` : les dépendances DU LAUNCHER. Sans argument, pip-audit examine
      # l'environnement courant — ici ruff et pip-audit eux-mêmes — et son
      # vert ne disait rien du launcher (constaté le 2026-09-18).
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # Les planchers ci-dessus se résolvent au plus récent ; ce qui s'installe
      # VRAIMENT (CI et exécutables publiés) est figé dans .github/requirements.
      # Le 2026-10-25, ces fichiers portaient setuptools 84.0.0 et filelock
      # 4.2.0, vulnérables, alors que l'audit des planchers restait vert.
      - name: Audit des paquets figés
        run: |
          pip-audit --require-hashes --disable-pip -r .github/requirements/tests.txt
          pip-audit --require-hashes --disable-pip -r .github/requirements/securite.txt
          pip-audit --require-hashes --disable-pip -r .github/requirements/fuzz.txt

      # Les workflows eux-mêmes : action non épinglée, injection dans un `run:`,
      # identifiants laissés au checkout, Dependabot sans délai. Le jeton (lecture
      # seule) sert à reconnaître une action dont la version connue est vulnérable.
      - name: Audit des workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github
