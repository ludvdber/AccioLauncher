# CI Accio Launcher — pytest sur Windows (plateforme cible) + smoke test Linux
# (objectif déclaré : portage Linux — attrape les fuites win32 dès la PR).
#
# Les actions sont épinglées par empreinte de commit, version en commentaire :
# une étiquette (@v7) peut être déplacée par qui prend la main sur le dépôt de
# l'action, une empreinte non. Dependabot tient les deux à jour ensemble.
#
# Même principe pour les paquets Python : .github/requirements/tests.txt fige
# versions et empreintes (Windows et Linux, Python 3.15, dans un seul fichier).
# Les planchers de requirements*.txt restent la source de vérité ; ce fichier
# en est la résolution, et la commande pour le refaire est dans son en-tête.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nouveau push rend le run précédent sans objet : on l'annule plutôt que de
# le laisser occuper un runner Windows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    # Un test bloqué (invite UAC, exec() modal) ne doit pas brûler les six
    # heures par défaut d'un runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Installer les dépendances
        run: pip install --require-hashes -r .github/requirements/tests.txt
      - name: Lint (jeu de regles fige dans pyproject.toml)
        run: python -m ruff check .
      - name: Types (mypy sur src/core, regle dans pyproject.toml)
        run: python -m mypy
      # Binaires non suivis par git (Scorecard) : release officielle r2117,
      # empreinte du zip et de chaque fichier vérifiées.
      - name: vgmstream (release officielle, empreintes vérifiées)
        run: python build/vgmstream.py
      # Un plantage natif (violation d'accès dans Qt) ne laisse dans le journal
      # que la pile PYTHON — « cannot get C stack on this system ». Payé le
      # 2026-09-18 : deux runs rouges, jamais reproduits en local, et rien pour
      # dire quel module avait fauté. Windows Error Reporting écrit un minidump
      # de python.exe s'il meurt, joint au run ci-dessous en cas d'échec.
      - name: Vidages de plantage (Windows Error Reporting)
        shell: pwsh
        run: |
          $cle = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe'
          New-Item -Path $cle -Force | Out-Null
          New-ItemProperty -Path $cle -Name DumpFolder -PropertyType ExpandString -Value "$env:RUNNER_TEMP\vidages" -Force | Out-Null
          New-ItemProperty -Path $cle -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $cle -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
      # --timeout : un test bloqué meurt en 60 s, sa pile au journal, au lieu
      # de brûler les 30 minutes du job (le plus long en mesure 4 s).
      # --cov : couverture visible à chaque run (85 % mesurés le 2026-10-08),
      # plancher bas à 83 % : il arrête une chute, pas un écart de quelques
      # lignes (ACT-016).
      # -n 4 --dist loadfile : les 4 cœurs du runner, chaque fichier de tests
      # entier sur un même cœur (l'état partagé d'un module reste dans son
      # processus). Mesuré en local le 2026-10-27 : toute la suite en 90 s,
      # 5 min sur un cœur en CI.
      - name: Tests (offscreen via conftest)
        run: python -m pytest -v --tb=short --timeout=60 -n 4 --dist loadfile --cov=src --cov=main --cov-report=term --cov-fail-under=83
      # Les tests tournent en offscreen, où Qt ne voit aucune police système et
      # mesure tout en Cinzel. tools/audit_geometrie.py rejoue la mise en page
      # sur la plateforme native, avec les vraies polices de Windows. Il ne
      # tournait que dans build.bat, donc sur la machine qui publie, au moment
      # de publier : une régression de mise en page rougit maintenant la PR
      # (117 s mesurées).
      - name: Geometrie avec les vraies polices
        run: python tools/audit_geometrie.py
      - name: Joindre les vidages de plantage
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vidages-plantage-windows
          path: ${{ runner.temp }}/vidages
          if-no-files-found: ignore
          retention-days: 7

  linux-smoke:
    # Figé, pas `ubuntu-latest` : ce label passe à Ubuntu 26 le 2026-10-19, et
    # un runner qui change sous nos pieds rend un rouge ininterprétable. Même
    # choix dans tous les workflows ; seul le build AppImage reste en 22.04
    # (glibc de la machine de build).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # BLOQUANT depuis le 2026-09-18. Il a été informatif (`continue-on-error`)
    # tant que le portage Linux n'avait pas commencé, et il est resté rouge
    # deux fois des semaines durant sans que personne le voie : un run dont la
    # couleur globale reste verte ne se regarde pas. Un rouge ici doit arrêter
    # le run, comme sous Windows.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      # libpulse0 et libgssapi-krb5-2 : sans elles, QtMultimedia ne se charge
      # pas et les tests de vraie lecture vidéo sont sautés ici alors que le
      # job linux de release.yml les installe et les joue. Release #22 du
      # 2026-10-27 figée sur un test que ce job n'avait jamais lancé.
      - name: Bibliothèques système Qt (plateforme offscreen, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libgssapi-krb5-2
      - name: Installer les dépendances
        run: pip install --require-hashes -r .github/requirements/tests.txt
      - name: Tests (offscreen via conftest)
        run: python -m pytest -v --tb=short --timeout=60 -n 4 --dist loadfile

  python-preversion:
    # Python 3.16 en PRÉVERSION, pour voir venir ce qui cassera (2026-10-29) :
    # la suite y passe en 3.16.0a1. INFORMATIF par exception, et seulement ici :
    # une préversion change sous nos pieds d'une alpha à l'autre, et ce rouge-là
    # ne dit rien du launcher publié (le linux-smoke, lui, reste bloquant).
    # Paquets figés à part (preversion.txt) : Pillow n'a pas de paquet 3.16.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Par uv et non setup-python : le manifeste d'actions/python-versions n'a
      # pas encore de 3.16 (« version '3.16' not found », 2026-10-29) ; les
      # builds de python-build-standalone, eux, ont la 3.16.0a1. uv épinglé.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.16"
          activate-environment: true
          enable-cache: false
      - name: Bibliothèques système Qt (plateforme offscreen, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libgssapi-krb5-2
      - name: Installer les dépendances
        run: uv pip install --require-hashes -r .github/requirements/preversion.txt
      - name: Tests (offscreen via conftest)
        run: python -m pytest -q --tb=short --timeout=60 -n 4 --dist loadfile
