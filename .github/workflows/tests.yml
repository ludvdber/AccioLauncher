# CI Accio Launcher — pytest sur Windows (plateforme cible) + smoke test Linux
# (objectif déclaré : portage Linux — attrape les fuites win32 dès la PR).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (jeu de regles fige dans pyproject.toml)
        run: python -m ruff check .
      - name: Tests (offscreen via conftest)
        run: python -m pytest -v --tb=short

  linux-smoke:
    runs-on: ubuntu-latest
    # Informatif tant que le portage Linux n'a pas commencé : ne bloque pas le
    # merge, mais montre ce qui casserait. Passer à false au début du chantier.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Bibliothèques système Qt (plateforme offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (offscreen via conftest)
        run: python -m pytest -v --tb=short
