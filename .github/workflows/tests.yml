# CI Accio Launcher — pytest sur Windows (plateforme cible) + smoke test Linux
# (objectif déclaré : portage Linux — attrape les fuites win32 dès la PR).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (jeu de regles fige dans pyproject.toml)
        run: python -m ruff check .
      - name: Tests (offscreen via conftest)
        run: python -m pytest -v --tb=short

  linux-smoke:
    runs-on: ubuntu-latest
    # BLOQUANT depuis le 2026-09-18. Il a été informatif (`continue-on-error`)
    # tant que le portage Linux n'avait pas commencé, et il est resté rouge
    # deux fois des semaines durant sans que personne le voie : un run dont la
    # couleur globale reste verte ne se regarde pas. Un rouge ici doit arrêter
    # le run, comme sous Windows.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Bibliothèques système Qt (plateforme offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (offscreen via conftest)
        run: python -m pytest -v --tb=short
